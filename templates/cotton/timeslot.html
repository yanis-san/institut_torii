<!-- templates/cotton/timeslot.html -->
<c-vars slot_obj="" selected="false" />

{% load appointments_tags %}

<button type="button"
        class="group relative flex flex-col items-center px-4 py-3 rounded-xl border-2 transition-all duration-200
               {% if selected == 'true' %}
               border-red-500 bg-red-50 ring-2 ring-red-500/20
               {% else %}
               border-gray-200 hover:border-red-300 hover:bg-red-50/50
               {% endif %}"
        {{ attrs }}>
    <span class="text-lg font-semibold text-gray-800 group-hover:text-red-500 transition-colors">
        {{ slot_obj.start_time|time:"H:i" }}
    </span>
    <span class="text-xs text-gray-400">
        → {{ slot_obj.end_time|time:"H:i" }}
    </span>
    {% if slot_obj.remaining_spots <= 2 and slot_obj.remaining_spots > 0 %}
    <span class="mt-1 text-[10px] font-medium text-amber-600">
        {{ slot_obj.remaining_spots }} place{{ slot_obj.remaining_spots|pluralize }}
    </span>
    {% endif %}
</button>
