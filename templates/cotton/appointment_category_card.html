<!-- templates/cotton/appointment_category_card.html -->
<c-vars category="" />

<button type="button"
        class="group flex items-start gap-4 p-5 bg-white border-2 border-gray-100 rounded-2xl hover:border-red-300 hover:shadow-lg hover:shadow-red-500/5 transition-all duration-300 text-left w-full"
        {{ attrs }}>
    {% if category.icon %}
    <span class="text-3xl shrink-0 mt-0.5">{{ category.icon }}</span>
    {% else %}
    <span class="text-3xl shrink-0 mt-0.5">📅</span>
    {% endif %}
    <div class="flex-1 min-w-0">
        <h3 class="text-base font-semibold text-gray-800 group-hover:text-red-500 transition-colors">
            {{ category.name }}
        </h3>
        {% if category.description %}
        <p class="text-sm text-gray-500 mt-1 line-clamp-2">{{ category.description }}</p>
        {% endif %}
        <div class="flex items-center gap-2 mt-2">
            <span class="inline-flex items-center gap-1 text-xs text-gray-400">
                <i class="bx bx-time-five"></i>
                {{ category.duration_minutes }} min
            </span>
        </div>
    </div>
    <i class="bx bx-chevron-right text-xl text-gray-300 group-hover:text-red-400 transition-colors shrink-0 mt-1"></i>
</button>
