<!-- templates/cotton/cms_stat_card.html -->
<c-vars value="" label="" color="red" icon="" />

<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5" {{ attrs }}>
    <div class="flex items-start justify-between">
        <div>
            <p class="text-sm text-zinc-400 mb-1">{{ label }}</p>
            <p class="text-2xl font-bold
                      {% if color == 'red' %}text-red-400
                      {% elif color == 'emerald' %}text-emerald-400
                      {% elif color == 'amber' %}text-amber-400
                      {% elif color == 'blue' %}text-blue-400
                      {% elif color == 'purple' %}text-purple-400
                      {% else %}text-white{% endif %}">
                {{ value }}
            </p>
        </div>
        {% if icon %}
        <span class="text-2xl opacity-60">{{ icon }}</span>
        {% endif %}
    </div>
    {% if slot %}
    <div class="mt-2 text-xs text-zinc-500">{{ slot }}</div>
    {% endif %}
</div>
