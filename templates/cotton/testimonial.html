<c-vars initials="" name="" role="" />

<div class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-lg transition-all duration-300 hover:-translate-y-1 p-8">
    <div class="flex items-center gap-4 mb-5">
        <div class="w-11 h-11 bg-red-500 rounded-full flex items-center justify-center text-white text-sm font-semibold">
            {{ initials }}
        </div>
        <div>
            <h4 class="text-sm font-semibold text-gray-800">{{ name }}</h4>
            <p class="text-xs text-gray-400">{{ role }}</p>
        </div>
    </div>
    <p class="text-sm text-gray-500 leading-relaxed italic">{{ slot }}</p>
</div>
