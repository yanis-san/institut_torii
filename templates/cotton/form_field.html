<c-vars label="" required="false" help_text="" />

<div {{ attrs }}>
    {% if label %}
    <label class="block text-sm font-medium text-gray-700 mb-2">
        {{ label }}
        {% if required == "true" %}<span class="text-red-400">*</span>{% endif %}
    </label>
    {% endif %}
    {{ slot }}
    {% if help_text %}
    <p class="text-xs text-gray-400 mt-1">{{ help_text }}</p>
    {% endif %}
</div>
