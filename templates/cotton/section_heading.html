<c-vars title="" subtitle="" centered="true" />

<div class="{% if centered == 'true' %}text-center{% endif %} mb-16">
    <h2 class="text-4xl md:text-5xl font-bold text-gray-800 mb-6">
        {{ title }}
    </h2>
    {% if subtitle %}
    <p class="text-xl text-gray-500 max-w-3xl {% if centered == 'true' %}mx-auto{% endif %} leading-relaxed">
        {{ subtitle }}
    </p>
    {% endif %}
    {{ slot }}
</div>
