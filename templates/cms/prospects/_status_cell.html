<!-- Inline status cell — swapped by htmx -->
<td class="px-5 py-3" id="status-{{ prospect.pk }}">
    <div x-data="{
            open: false,
            pos: { top: 0, left: 0 },
            reposition() {
                let rect = this.$refs.trigger.getBoundingClientRect();
                let dropH = 260;
                let spaceBelow = window.innerHeight - rect.bottom;
                if (spaceBelow < dropH) {
                    this.pos.top = rect.top - dropH + 'px';
                } else {
                    this.pos.top = rect.bottom + 4 + 'px';
                }
                this.pos.left = rect.left + 'px';
            },
            toggle() {
                this.open = !this.open;
                if (this.open) this.reposition();
            }
         }" class="relative">
        <button x-ref="trigger" @click="toggle()" type="button"
                class="flex items-center gap-1.5 text-xs group">
            <c-cms-badge label="{{ prospect.get_status_display }}" color="{{ prospect.status_color }}" />
            <svg class="w-3 h-3 text-zinc-500 group-hover:text-zinc-300 transition-colors"
                 :class="open && 'rotate-180'" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <div x-show="open" @click.away="open = false" x-transition
             :style="'top:' + pos.top + ';left:' + pos.left"
             class="fixed z-50 w-40 bg-zinc-800 border border-zinc-700 rounded-lg shadow-xl py-1">
            {% for value, label in status_choices %}
            <form method="post" action="{% url 'cms:prospect_set_status' prospect.pk %}"
                  hx-post="{% url 'cms:prospect_set_status' prospect.pk %}"
                  hx-target="#status-{{ prospect.pk }}"
                  hx-swap="outerHTML">
                {% csrf_token %}
                <input type="hidden" name="status" value="{{ value }}" />
                <button type="submit" @click="open = false"
                        class="w-full text-left px-3 py-1.5 text-xs hover:bg-zinc-700 transition-colors text-zinc-200">
                    {{ label }}
                </button>
            </form>
            {% endfor %}
        </div>
    </div>
</td>
