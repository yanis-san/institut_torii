{% load static %}
<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — CMS Institut Torii</title>
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}" />
</head>
<body class="h-full bg-zinc-950 text-zinc-100 antialiased flex items-center justify-center">

    <div class="w-full max-w-sm mx-auto px-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <span class="text-5xl block mb-3">⛩️</span>
            <h1 class="text-xl font-bold text-white">Institut Torii</h1>
            <p class="text-sm text-zinc-400 mt-1">Espace administration</p>
        </div>

        <!-- Card -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6">
            <form method="post" class="space-y-5">
                {% csrf_token %}

                {% if form.errors %}
                <div class="bg-red-500/10 border border-red-500/30 rounded-lg px-4 py-3">
                    <p class="text-sm text-red-400">Identifiants incorrects. Veuillez réessayer.</p>
                </div>
                {% endif %}

                <div class="space-y-1.5">
                    <label for="id_username" class="block text-sm font-medium text-zinc-300">Nom d'utilisateur</label>
                    {{ form.username }}
                </div>

                <div class="space-y-1.5">
                    <label for="id_password" class="block text-sm font-medium text-zinc-300">Mot de passe</label>
                    {{ form.password }}
                </div>

                <button type="submit"
                        class="w-full px-4 py-2.5 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 transition-colors shadow-lg shadow-red-600/20">
                    Se connecter
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-zinc-600 mt-6">&copy; Institut Torii — {{ year }}</p>
    </div>

</body>
</html>
