<!-- templates/marketing/unsubscribe.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Se désabonner — Institut Torii</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}" />
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 text-center">
            <span class="text-4xl mb-4 block">⛩️</span>
            <h1 class="text-xl font-bold text-white mb-2">Se désabonner</h1>
            <p class="text-zinc-400 text-sm mb-6">
                Vous ne souhaitez plus recevoir nos emails ?<br />
                Confirmez le désabonnement pour <strong class="text-white">{{ email }}</strong>.
            </p>

            <form method="post" x-data="{ submitting: false }"
                  @submit="if (submitting) { $event.preventDefault(); return; } submitting = true">
                {% csrf_token %}
                <button type="submit"
                        :disabled="submitting"
                        :class="submitting && 'opacity-50 cursor-not-allowed'"
                        class="w-full px-6 py-3 bg-red-600 text-white font-medium rounded-xl hover:bg-red-700 transition-colors">
                    <span x-show="!submitting">Confirmer le désabonnement</span>
                    <span x-show="submitting" x-cloak><i class="bx bx-loader-alt bx-spin"></i> Traitement…</span>
                </button>
            </form>

            <p class="text-xs text-zinc-500 mt-6">
                Si vous avez cliqué par erreur, fermez simplement cette page.
            </p>
        </div>
        <p class="text-center text-xs text-zinc-600 mt-4">Institut Torii — Cours de japonais, chinois et coréen</p>
    </div>
</body>
</html>
