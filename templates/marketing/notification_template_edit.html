<!-- templates/marketing/notification_template_edit.html -->
<c-cms-layout title="Modifier — {{ template.get_event_type_display }}">

    <c-cms-page-header
        title="{{ template.get_event_type_display }}"
        subtitle="Personnalisez le contenu de cet email automatique">
        <c-cms-btn href="{% url 'marketing:notification_template_list' %}" variant="secondary" size="sm">← Retour</c-cms-btn>
    </c-cms-page-header>

    <form method="post">
        {% csrf_token %}

        <div class="space-y-6">

            <!-- Variables available -->
            <div class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-4">
                <p class="text-xs font-semibold text-zinc-400 mb-2">📌 Variables disponibles pour cet email :</p>
                <div class="flex flex-wrap gap-2">
                    {% for var in variables %}
                    <code class="px-2 py-1 bg-zinc-800 border border-zinc-700 rounded-lg text-xs text-red-400 font-mono">
                        {% templatetag openvariable %} {{ var }} {% templatetag closevariable %}
                    </code>
                    {% endfor %}
                </div>
            </div>

            <!-- Subject -->
            <c-cms-card title="Objet de l'email">
                <c-cms-field :field="form.subject" label="Objet" />
            </c-cms-card>

            <!-- HTML Content -->
            <c-cms-card title="Contenu HTML">
                <c-cms-field :field="form.body_html" label="Corps de l'email"
                             help="Utilisez du HTML simple. Les variables seront remplacées automatiquement." />
            </c-cms-card>

            <!-- Status -->
            <c-cms-card title="Options">
                <div class="flex items-center gap-3">
                    {{ form.is_active }}
                    <label for="{{ form.is_active.id_for_label }}" class="text-sm text-zinc-300 cursor-pointer">
                        Template actif (si désactivé, le template par défaut sera utilisé)
                    </label>
                </div>
            </c-cms-card>

        </div>

        <!-- Sticky save bar -->
        <div class="sticky bottom-0 mt-6 -mx-4 px-4 py-4 bg-zinc-900/95 backdrop-blur-sm border-t border-zinc-800 flex justify-between lg:-mx-8 lg:px-8">
            <div class="flex gap-3">
                <c-cms-btn href="{% url 'marketing:notification_template_preview' pk=template.pk %}" variant="ghost">👁️ Aperçu</c-cms-btn>
            </div>
            <div class="flex gap-3">
                <c-cms-btn href="{% url 'marketing:notification_template_list' %}" variant="secondary">Annuler</c-cms-btn>
                <c-cms-btn type="submit">Enregistrer</c-cms-btn>
            </div>
        </div>
    </form>

</c-cms-layout>
